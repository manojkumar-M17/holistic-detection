# Canonical Label Taxonomy and Source Mappings for AI Exam Hall Monitoring
version: 1.0

# Canonical Object Classes for YOLO Detection
canonical_object_classes:
  0: person
  1: phone
  2: paper
  3: book
  4: calculator
  5: laptop
  6: watch
  7: earphone_or_earbud

# Canonical Behavior Classes (Used for Behavior Analytics & Validation)
canonical_behavior_classes:
  - normal
  - reading
  - writing
  - looking_down
  - looking_left
  - looking_right
  - standing
  - talking
  - using_phone

# Mapping Rules from Various Source Datasets to Canonical Classes
source_mappings:
  # COCO Standard 80 Classes
  coco:
    0: 0    # person -> person
    67: 1   # cell phone -> phone
    73: 3   # book -> book
    63: 5   # laptop -> laptop
    # All other COCO classes (cars, animals, food, etc.) are unmapped (ignored)

  # Exam Cheating Object Datasets (e.g., Kaggle / OpenData Exam Object Callsets)
  exam_objects:
    "person": 0
    "student": 0
    "invigilator": 0
    "candidate": 0
    "phone": 1
    "cellphone": 1
    "mobile": 1
    "smartphone": 1
    "paper": 2
    "cheat_sheet": 2
    "notes": 2
    "exam_paper": 2
    "book": 3
    "textbook": 3
    "notebook": 3
    "calculator": 4
    "scientific_calculator": 4
    "laptop": 5
    "computer": 5
    "tablet": 5
    "watch": 6
    "smartwatch": 6
    "wrist_watch": 6
    "earphone": 7
    "earbud": 7
    "airpods": 7
    "headphone": 7

  # Smart Classroom Behavior Datasets (SCB / SCBehavior)
  sc_behavior:
    "normal": "normal"
    "reading": "reading"
    "writing": "writing"
    "looking_down": "looking_down"
    "looking_around": null       # Direction unknown; not forced to left/right
    "turn_head_left": "looking_left"
    "turn_head_right": "looking_right"
    "standing": "standing"
    "standing_up": "standing"
    "hand_raising": "normal"     # Valid exam behavior; mapped to normal
    "talking": "talking"
    "whispering": "talking"
    "using_phone": "using_phone"

notes:
  - "Classes mapped to null are dropped during normalization to avoid false label assignment."
  - "No left/right directional assumptions are made if the source lacks directional metadata."
