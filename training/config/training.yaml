# Central Hyperparameter Configuration for YOLO Training
version: 1.0

# Base Model Architecture
base_model: "weights/yolov8n.pt"  # Pretrained weights to fine-tune from

# Training Parameters
training:
  epochs: 100
  patience: 15          # Early stopping patience
  batch_size: 16        # Scaled down automatically on CPU or low-memory GPUs
  image_size: 640
  optimizer: "auto"     # AdamW or SGD depending on dataset scale
  lr0: 0.01             # Initial learning rate
  lrf: 0.01             # Final learning rate fraction
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  seed: 42
  device: "auto"        # "auto", "cpu", "0", "cuda:0"
  workers: 4
  save_period: 10       # Save checkpoint every N epochs

# Smoke-Test Settings (Minimal CPU smoke run)
smoke_test:
  epochs: 1
  batch_size: 2
  image_size: 320
  device: "cpu"
  workers: 0

# Data Augmentation Parameters (Conservative for Exam Hall Geometry)
augmentation:
  hsv_h: 0.015          # Hue augmentation fraction
  hsv_s: 0.5            # Saturation augmentation fraction
  hsv_v: 0.4            # Brightness/Value augmentation fraction
  degrees: 10.0         # Slight rotation angle (+/- degrees)
  translate: 0.08       # Translation fraction
  scale: 0.2            # Scale variation fraction
  shear: 2.0            # Perspective shear angle
  perspective: 0.0001
  flipud: 0.0           # Vertical flip prohibited (students are upright)
  fliplr: 0.5           # Horizontal flip enabled
  mosaic: 0.5           # Mosaic augmentation ratio
  mixup: 0.0            # Mixup disabled to maintain clear bounding box edges
