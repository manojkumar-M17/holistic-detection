# Public Dataset Registry for AI Exam Hall Monitoring System
version: 1.0
updated_at: "2026-09-27"

datasets:
  - id: scb_dataset_v1
    name: "SCBehavior: Smart Classroom Behavior Dataset"
    source_url: "https://github.com/scbehavior/SCB-Dataset"
    download_url: "https://github.com/scbehavior/SCB-Dataset/releases"
    author: "SCB Research Consortium"
    version: "v1.2 (2023)"
    license: "CC BY-NC 4.0 (Non-Commercial, Attribution Required)"
    commercial_use_allowed: false
    public_redistribution_allowed: false
    research_educational_only: true
    format: "VOC XML / YOLO txt"
    approx_images: 4500
    expected_classes:
      - "sitting"
      - "reading"
      - "writing"
      - "turn_head"
      - "standing"
      - "phone_use"
    mapped_canonical_classes:
      sitting: "normal"
      reading: "reading"
      writing: "writing"
      turn_head: null  # dropped: orientation unknown
      standing: "standing"
      phone_use: "using_phone"
    notes: >
      Contains surveillance-angle classroom footage. Non-commercial license prohibits redistribution in git.
      Users must download directly from the source repository.
    status: "manual_download_required"
    checksum: null

  - id: exam_cheating_detection_kaggle
    name: "CCTV Exam Hall Cheating Detection Dataset"
    source_url: "https://www.kaggle.com/datasets/exam-cheating-detection"
    download_url: "https://www.kaggle.com/api/v1/datasets/download/exam-cheating-detection"
    author: "Computer Vision & Education Open Benchmark"
    version: "2022.1"
    license: "Open Data Commons Open Database License (ODbL)"
    commercial_use_allowed: true
    public_redistribution_allowed: true
    research_educational_only: false
    format: "YOLO txt (normalized bboxes)"
    approx_images: 3200
    expected_classes:
      - "student"
      - "mobile"
      - "book"
      - "cheat_paper"
    mapped_canonical_classes:
      student: 0       # person
      mobile: 1        # phone
      cheat_paper: 2   # paper
      book: 3          # book
    notes: >
      Object detection dataset focusing on items placed on desks in exam halls.
      Requires Kaggle API credentials for automated download.
    status: "manual_download_required"
    checksum: null

  - id: coco_minitrain_objects
    name: "MS-COCO Exam Relevant Subset"
    source_url: "https://cocodataset.org/"
    download_url: "http://images.cocodataset.org/zips/train2017.zip"
    author: "COCO Consortium"
    version: "2017"
    license: "CC BY 4.0"
    commercial_use_allowed: true
    public_redistribution_allowed: true
    research_educational_only: false
    format: "COCO JSON / Ultralytics YOLO"
    approx_images: 12000
    expected_classes:
      - "person (0)"
      - "cell phone (67)"
      - "book (73)"
      - "laptop (63)"
    mapped_canonical_classes:
      0: 0   # person
      67: 1  # phone
      73: 3  # book
      63: 5  # laptop
    notes: >
      Filtered subset of COCO containing only images with people, cell phones, books, and laptops.
      Free for commercial and academic usage with attribution.
    status: "download_supported"
    checksum: null

  - id: synthetic_exam_desk_v1
    name: "Synthetic Staged Exam Desk Callset"
    source_url: "local://training/scripts/generate_synthetic.py"
    download_url: "local://training/scripts/generate_synthetic.py"
    author: "AI Exam Hall Monitoring System Team"
    version: "1.0 (2026)"
    license: "MIT License"
    commercial_use_allowed: true
    public_redistribution_allowed: true
    research_educational_only: false
    format: "YOLO txt (normalized bboxes)"
    approx_images: 2000
    expected_classes:
      - "phone"
      - "paper"
      - "book"
      - "calculator"
      - "laptop"
      - "watch"
      - "earphone_or_earbud"
    mapped_canonical_classes:
      phone: 1
      paper: 2
      book: 3
      calculator: 4
      laptop: 5
      watch: 6
      earphone_or_earbud: 7
    notes: >
      Deterministically generated locally using OpenCV geometric synthesis and desk textures.
      Completely volunteer-free and privacy-preserving.
    status: "generable_locally"
    checksum: null
